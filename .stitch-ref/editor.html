<!-- Micro-interaction Script -->
<script>
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPopover = document.getElementById('settingsPopover');

        function toggleSettings() {
            settingsPopover.classList.toggle('hidden');
            if(!settingsPopover.classList.contains('hidden')) {
                settingsBtn.classList.add('text-primary', 'border-primary', 'bg-secondary-container');
            } else {
                settingsBtn.classList.remove('text-primary', 'border-primary', 'bg-secondary-container');
            }
        }

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSettings();
        });

        // Close on escape or outside click
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !settingsPopover.classList.contains('hidden')) {
                toggleSettings();
            }
        });

        document.addEventListener('click', (e) => {
            if (!settingsPopover.contains(e.target) && e.target !== settingsBtn && !settingsPopover.classList.contains('hidden')) {
                toggleSettings();
            }
        });

        // Simple placeholder animation for "Saving"
        const savingText = document.querySelector('header .text-on-surface-variant');
        setInterval(() => {
            savingText.textContent = 'Saved locally';
            setTimeout(() => {
                savingText.textContent = 'Syncing...';
            }, 5000);
        }, 8000);
    </script>
